[advisories]
yanked = "deny"
ignore = [
    # paste is an indirect dep of alloy; the advisory is an unmaintained notice only.
    # No vulnerability; no security risk. Will resolve when alloy drops paste.
    "RUSTSEC-2024-0436",
    # proc-macro-error2 is a build-time proc-macro dep of alloy-sol-macro (alloy).
    # Author confirmed it unmaintained (RUSTSEC-2026-0173); unmaintained notice only,
    # no vulnerability. Will resolve when alloy-sol-macro migrates off it.
    "RUSTSEC-2026-0173",
    # basic-toml reaches us only through i18n-config, used by age's build-time proc-macros
    # (i18n-embed-fl, i18n-embed-impl). Unmaintained notice only, no vulnerability, and no
    # upgrade exists. Will resolve when i18n-config moves to toml.
    "RUSTSEC-2026-0374",
    # webpki-roots 0.26.11 is a semver shim whose only item is `pub use parent::TLS_SERVER_ROOTS`
    # from webpki-roots 1, locked at 1.0.10, which drops the emSign root this advisory names.
    # tokio-tungstenite 0.28 requires ^0.26 and no fixed 0.26 exists. The [bans] entries keep
    # every other affected webpki-roots version out. Will resolve when tokio-tungstenite moves
    # to webpki-roots 1.
    "RUSTSEC-2026-0381",
    # crypto-bigint 0.5.5 has timing-variable operations meant to be constant time; the fix is
    # 0.7.6, but elliptic-curve 0.13 (alloy-signer, k256, ecdsa) requires ^0.5, so no lockfile
    # update reaches it. Its secret-key use is ECDSA signing by the live venue client and the
    # redemption signer, both run only with live credentials; paper mode never signs. The
    # [bans] entries keep every other affected version out. Will resolve when alloy and k256
    # move to elliptic-curve 0.14 or later.
    "RUSTSEC-2026-0387",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    # Unlicense: public domain equivalent; used by async_io_stream, pharos,
    # ws_stream_wasm (indirect deps pulled in by alloy's WS provider).
    "Unlicense",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # RUSTSEC-2026-0381 is ignored above only for the 0.26.11 shim; these keep the advisory's
    # other affected versions (everything below 1.0.10) out of Cargo.lock.
    { name = "webpki-roots", version = "<0.26.11" },
    { name = "webpki-roots", version = ">=1.0.0, <1.0.10" },
    # RUSTSEC-2026-0387 is ignored above only for crypto-bigint 0.5.5, which elliptic-curve 0.13
    # pins; these keep the advisory's other affected versions (everything below 0.7.6) out.
    { name = "crypto-bigint", version = "<0.5.5" },
    { name = "crypto-bigint", version = ">0.5.5, <0.7.6" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
