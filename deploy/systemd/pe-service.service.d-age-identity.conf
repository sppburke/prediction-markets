# #508 Phase D (D1): systemd drop-in for the ordinary pe-service unit delivering the
# service-scoped age identity that decrypts the site-sealed per-account live credential
# bundles (docs/35 deploy runbook; the canary LoadCredential custody precedent).
#
# Install as /etc/systemd/system/pe-service.service.d/age-identity.conf, with the
# identity source file root-owned mode 0600, then:
#   sudo systemctl daemon-reload && sudo systemctl cat pe-service   # verify the mapping
# and deploy the Phase-D binary in the same restart. Without a valid identity the
# service still boots (paper path unaffected) but no account can ever arm (fail closed).
[Service]
LoadCredential=pe-age-identity:/etc/pe-service/pe-age-identity
