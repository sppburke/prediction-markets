# #737 release 1: stop automatic restarts when checkpoint quarantine cannot be made
# durable. Exit 78 requires the quiesced checkpoint recovery in docs/35.
#
# Install as /etc/systemd/system/pe-service.service.d/checkpoint-invalidation.conf,
# then:
#   sudo systemctl daemon-reload
#   systemctl show pe-service -p RestartPreventExitStatus
[Service]
RestartPreventExitStatus=78
