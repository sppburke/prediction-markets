# Paper-mode service config.
# Secrets injected via PE_* env vars from .env.
# Run: set -a; source .env; set +a; ./target/release/pe-service smoke-test/service.toml

bind                             = "0.0.0.0:8080"

polymarket_base_url              = "https://data-api.polymarket.com"
polymarket_channel_capacity      = 256

trade_poll_interval_secs         = 30

event_log_path                   = "smoke-test/paper.log"
jsonl_log_path                   = "smoke-test/paper.jsonl"

bankroll_usd                     = "10000"
mode                             = "paper"

# Copy-entry gate (issues #290, #339): copy only a leader's first-ever BUY entry into a
# market that resolves within [min, max] of now. The leader-price band was removed in
# #339 — live sizing is re-based on the current market price instead. Hold-to-resolution
# is enforced by the orchestrator's filled-positions set.
# Version-two durable reconciled history is mandatory; missing/incomplete wallets are
# excluded before membership publication (there is no runtime fail-open switch).
# One-time version-two migration input (see `_GLOSSARY.md`, entry gate): the captured
# legacy history file the previous service wrote at this path. It must stay present and
# unchanged until the migration reaches phase `installed`; later boots ignore it.
legacy_wallet_history_path       = "smoke-test/wallet_market_history.json"
max_resolution_horizon_secs      = 172800  # 48 h (run28 cutover)
min_fill_price                   = "0.15"  # run28 entry-band floor (current price)
watchlist_membership_mode        = "full_rerank"  # run28 cutover; knockout = legacy
min_resolution_horizon_secs      = 60      # docs/29 copy floor; sub-minute breaks down
max_fill_price                   = "0.85"  # #142 parity: skip BUYs at/above this current price

# Live wallet source (#339, #370): Supabase ranking handoff — the SOLE wallet source.
# The url is empty here; the live box overrides it via PE_SUPABASE_URL from .env (figment
# env-wins). With no fallback, the service hard-fails at boot if Supabase resolves empty.
# Secrets (PE_SUPABASE_ANON_KEY / PE_SUPABASE_SECRET_KEY) come from .env, never this file.
supabase_url                     = ""
supabase_refresh_interval_secs   = 300

# Sizing mode (#398 WS2): dollar = fixed $25/trade (bypasses Kelly), a safe comparable paper
# baseline. Switch to `{ kind = "kelly" }` to enable Kelly, or `{ kind = "contract", value = {
# contracts = N } }` for a fixed contract count. Env `PE_STRATEGY__SIZING_*` is NOT honored
# (figment has no `.split("__")`); set the boot default here and seed `service_config` to match.
[strategy]
sizing_mode = { kind = "dollar", value = { usd = "25" } }
