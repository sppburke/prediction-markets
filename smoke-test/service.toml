# Paper-mode service config.
# Secrets injected via PE_* env vars from .env.
# Run: set -a; source .env; set +a; ./target/release/pe-service smoke-test/service.toml

bind                             = "0.0.0.0:8080"

# Backfill ~2 weeks of Polygon blocks to seed the funding-graph with recent funder data
# (~100k blocks ≈ 2 days; enough to capture active funders without a multi-hour backfill).
backfill_blocks                  = 0

polygon_checkpoint_path          = "smoke-test/polygon_checkpoint.json"
polygon_channel_capacity         = 256

polymarket_base_url              = "https://data-api.polymarket.com"
polymarket_channel_capacity      = 256

# Seed-only cohort: 0 means the live leaderboard contributes no wallets, so the
# watchlist is exactly the seed file below. Startup always fetches + merges the
# leaderboard, so this is the only way to follow ONLY the validated cohort.
watchlist_size                   = 0
trade_poll_interval_secs         = 30
# 13-wallet 72hr buy-and-hold BAND cohort (mid-price 0.40-0.80; leak-free, copy-and-hold
# validated, no exit adverse-selection). Supersedes the N=10 longshot list.
# NOTE: this JSON lives under gitignored data/ — scp it to the VPS; `git pull` won't deliver it.
seed_watchlist_path              = "data/watchlist-72hr-buyhold-band-n13.json"

event_log_path                   = "smoke-test/paper.log"
jsonl_log_path                   = "smoke-test/paper.jsonl"

operator_graph_rebuild_cadence_secs = 60

bankroll_usd                     = "10000"
mode                             = "paper"

# Copy-entry gate (issue #290): align live copies with the band-cohort selection —
# first-ever entry into a market, leader entry price in [0.40, 0.80], <72h to
# resolution. Hold-to-resolution is enforced by the orchestrator's filled-positions set.
wallet_market_history_path       = "smoke-test/wallet_market_history.json"
entry_gate_price_band_lo         = "0.40"
entry_gate_price_band_hi         = "0.80"
# fail-open: a wallet whose history could not be fetched (first-run API failure) is
# treated as new (copies allowed); the loader warns per absent wallet. Set true to block.
entry_gate_fail_closed           = false
max_resolution_horizon_secs      = 259200  # 72 h

# Flat sizing: bypasses Kelly. The n13 watchlist DOES carry real win_rate_bps
# (6316–8750), so Kelly is now available — remove flat_usd_per_trade to enable it.
# Kept flat ($25/trade) for now as a safe, comparable paper baseline.
[strategy]
flat_usd_per_trade               = "25"
