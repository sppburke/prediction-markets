# cargo-audit configuration (#508).
#
# RUSTSEC-2026-0235 (rkyv < 0.8.17 out-of-bounds reads validating Rc/Arc archives):
# rkyv 0.7 is an UNUSED optional dependency pin of rust_decimal in Cargo.lock — no
# workspace target enables the `rkyv` feature, and `cargo tree -i rkyv --workspace`
# resolves to nothing, so the vulnerable code is never compiled into any artifact.
# rust_decimal's compatible range is ^0.7 (>=0.8.17 is not reachable by a lockfile
# update); remove this ignore when rust_decimal moves to rkyv 0.8.
#
# RUSTSEC-2026-0381 (webpki-roots < 1.0.10 bundles the distrusted emSign ECC Root CA - G3):
# webpki-roots 0.26.11 is a semver shim whose only item is `pub use parent::TLS_SERVER_ROOTS`
# from webpki-roots 1, which Cargo.lock resolves to 1.0.10 (the root removed). tokio-tungstenite
# 0.28 requires ^0.26 and no fixed 0.26 exists; deny.toml's [bans] keep every other affected
# webpki-roots version out of Cargo.lock. Remove this ignore when it moves to webpki-roots 1.
#
# RUSTSEC-2026-0387 (crypto-bigint < 0.7.6 has timing-variable "constant-time" operations):
# crypto-bigint 0.5.5 is required by elliptic-curve 0.13 (alloy-signer, k256, ecdsa), whose ^0.5
# range no lockfile update can lift to the fixed 0.7.6. Its secret-key use is ECDSA signing by
# the live venue client and the redemption signer, both run only with live credentials; paper
# mode never signs. deny.toml's [bans] keep every other affected crypto-bigint version out of
# Cargo.lock. Remove this ignore when alloy and k256 move to elliptic-curve 0.14 or later.
#
# RUSTSEC-2026-0459 (libsqlite3-sys 0.6.0 to 0.38.2 bundle SQLite before 3.54.0, CVE-2026-119375):
# libsqlite3-sys 0.37.0 (SQLite 3.51.3) is required by rusqlite 0.39. The advisory exposes only a
# process that opens a database file, with its -wal, that a less trusted party could have written;
# pe-bootstrap, pe-service, pe-paper-state and pe-crypto-shadow open only databases this workspace's
# own processes create on hosts we operate, or copies and backups of them. The fix needs rusqlite
# 0.41, a breaking upgrade that changes the production SQLite engine, shipped as its own qualified
# change; deny.toml's [bans] keep every other affected libsqlite3-sys version out of Cargo.lock.
# Remove this ignore when rusqlite moves to 0.41 or later.
[advisories]
ignore = ["RUSTSEC-2026-0235", "RUSTSEC-2026-0381", "RUSTSEC-2026-0387", "RUSTSEC-2026-0459"]
