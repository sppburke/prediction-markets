[workspace]
resolver = "3"
members = [
    "crates/config",
    "crates/core-types",
    "crates/event-log",
    "crates/kelly-sizer",
    "crates/operator-graph",
    "crates/risk-engine",
    "crates/source-core",
    "crates/source-onchain-polygon",
    "crates/source-polymarket-public",
    "crates/service",
    "crates/venue-core",
]

[workspace.package]
edition = "2024"
rust-version = "1.95.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
float_arithmetic = "warn"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
blake3 = "1"
criterion = { version = "0.5", features = ["html_reports"] }
crc32fast = "1"
fs2 = "0.4"
insta = { version = "1", features = ["json"] }
proptest = "1"
rust_decimal = { version = "1", features = ["serde"] }
rust_decimal_macros = "1"
schemars = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["serde", "serde-well-known", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
toml = "0.8"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
trybuild = "1"
uuid = { version = "1", features = ["v4", "serde"] }
zstd = "0.13"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
inherits = "release"

[profile.profiling]
inherits = "release"
strip = "none"
debug = "line-tables-only"
