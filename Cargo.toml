[workspace]
resolver = "3"
members = [
    "crates/config",
    "crates/copy-signal-engine",
    "crates/core-types",
    "crates/event-log",
    "crates/kelly-sizer",
    "crates/position-ledger",
    "crates/risk-engine",
    "crates/resolver-card",
    "crates/source-core",
    "crates/source-polymarket-public",
    "crates/service",
    "crates/strategy-winner-follow",
    "crates/trader-index",
    "crates/venue-core",
    "crates/bootstrap",
    "crates/backtest",
    "crates/venue-polymarket",
    "crates/execution-core",
    "crates/paper-state",
    "crates/paper-pnl",
    "crates/crypto-shadow",
]
exclude = [
    "third_party/polymarket_client_sdk_v2",
]

[workspace.package]
edition = "2024"
rust-version = "1.95.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
float_arithmetic = "warn"

[workspace.dependencies]
anyhow = "1"
arc-swap = "1"
axum = "0.8"
blake3 = "1"
const_format = "0.2"
criterion = { version = "0.5", features = ["html_reports"] }
crc32fast = "1"
fs2 = "0.4"
futures = "0.3"
governor = "0.7"
insta = { version = "1", features = ["json"] }
proptest = "1"
rayon = "1"
rust_decimal = { version = "1", features = ["serde", "maths"] }
rust_decimal_macros = "1"
schemars = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["serde", "serde-well-known", "macros", "parsing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync"] }
# Dev-only (pg_parity scenario test, issue #397 follow-up): drives the live PL/pgSQL RPCs
# against a CI Postgres over localhost (NoTls). `runtime` feature for `connect`; jsonb is
# passed as text with a `::jsonb` cast, so no extra type-conversion features are needed.
tokio-postgres = "0.7"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
alloy-primitives = { version = "=1.5.7", default-features = false, features = ["std"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
url = "2"
toml = "0.8"
tower = "0.5"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
figment = { version = "0.10", features = ["toml", "env", "test"] }
trybuild = "1"
uuid = { version = "1", features = ["v4", "serde"] }
zstd = "0.13"
polymarket_client_sdk_v2 = { version = "=0.7.0", default-features = false, features = ["clob"] }

[patch.crates-io]
polymarket_client_sdk_v2 = { path = "third_party/polymarket_client_sdk_v2" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release-lto]
inherits = "release"
lto = "fat"

[profile.bench]
inherits = "release"

[profile.profiling]
inherits = "release"
strip = "none"
debug = "line-tables-only"
