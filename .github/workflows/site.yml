name: Site (analytics)

# Owns the build state of the first Node surface in the repo (issue #343 PR3).
# Path-filtered to site/** so it never runs on, and cannot regress, the Rust gate.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"

jobs:
  build:
    name: lint · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run test

      - run: npm run build
