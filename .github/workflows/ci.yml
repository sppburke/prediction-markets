name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# The gate used to be one serial job. Measured on the 2026-09-14 main run (61 min end to end):
# the Rust acceptance gate was 12.5 min, the Postgres scenarios 5.6 min, and a single serial
# `run:` block of shell/python drift guards 40.9 min -- of which two scenario suites
# (test_activate_generation.sh and test_activate_financial_era.sh) were ~16 min each, because
# both replay the real activation driver once per crash boundary.
#
# Splitting by owner turns sum() into max(). The two activation suites use six financial-era
# shards and four generation shards. Neither suite invokes cargo, so those jobs skip the
# toolchain, the cargo tools and the build cache.
#
# Measured again on 2026-09-18 (#664): pull requests waited about 26 min, set by the financial-era
# suite (25 min) although neither activation suite reads anything under crates/. Pull requests now
# run the activation suites only when they change a file those suites read (the `changes` job);
# every push to main runs everything. The two slowest Rust tests run in `rust-slow`, beside the gate.
jobs:
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    outputs:
      activation: ${{ steps.paths.outputs.activation }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The activation suites' complete inputs, audited for #664: the deploy and paper-reset
      # scripts and SQL they execute or copy, the SQL schemas their hermetic drivers copy, the
      # runbook they check flags against, and this workflow (the financial-era suite executes its
      # rehearsal dry-run command). --no-renames counts both sides of a rename. A missing base or
      # any failure to compute the diff runs the suites.
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          activation=true
          if [[ "$EVENT" == pull_request && -n "$BASE" ]] &&
             changed=$(git diff --no-renames --name-only "$BASE"...HEAD); then
            printf '%s\n' "$changed"
            grep -qE '^(scripts/deploy/|scripts/paper_reset/|scripts/migrate_service_config_545\.sql$|scripts/supabase_paper_state_schema\.sql$|scripts/supabase_multi_account_live_schema\.sql$|docs/35-PE-SERVICE-DEPLOY-RUNBOOK\.md$|\.github/workflows/ci\.yml$)' \
              <<< "$changed" || activation=false
          fi
          echo "activation=$activation" | tee -a "$GITHUB_OUTPUT"

  contracts:
    name: agent workflow contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Agent workflow contracts
        run: |
          bash scripts/check_skill_parity.sh
          bash scripts/check_skill_parity.sh --sync
          git diff --exit-code
          python3 scripts/check_agent_workflow_contract.py

      - name: Shell syntax
        run: |
          # `bash -n a.sh b.sh` checks only the FIRST file and treats the rest as positional
          # arguments, so a syntax error in any later script passed silently.
          for script in scripts/deploy/*.sh scripts/paper_reset/*.sh; do
            bash -n "$script" || exit 1
          done

  rust-lint:
    name: rustc 1.95.0 lint gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Hosted runners now start with ~86 GiB free, and a fresh full workspace test build peaks at
      # ~36 GiB (measured 10/11), so the preinstalled-SDK reclaim (53-160 s per Rust job) is gone. A
      # full disk shows up as `ld ... signal 7 [Bus error]` while linking; if that returns, restore
      # the reclaim from this step's history. df -h stays so disk headroom is visible in the log.
      - name: Disk space
        run: df -h /

      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit

      # The first nextest shard is the sole writer of the shared Rust cache.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gate
          save-if: "false"

      - name: rustc version contains 1.95.0
        run: rustc --version | grep -F '1.95.0'

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - run: cargo deny check

      - run: cargo audit

      - run: cargo metadata --locked --format-version 1 > /dev/null

  rust-test:
    name: rustc 1.95.0 tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: nextest 1/4
            shard: 1
          - suite: nextest 2/4
            shard: 2
          - suite: nextest 3/4
            shard: 3
          - suite: nextest 4/4
            shard: 4
          - suite: doc
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        if: matrix.suite != 'doc'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Disk space
        run: df -h /

      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"

      - name: Install cargo tools
        if: matrix.suite != 'doc'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - uses: Swatinem/rust-cache@v2
        if: matrix.shard == 1
        with:
          shared-key: gate

      - uses: Swatinem/rust-cache@v2
        if: matrix.shard != 1
        with:
          shared-key: gate
          save-if: "false"

      - name: Install Python analytics deps (needed by in-test cross-reader parity, #544)
        if: matrix.suite != 'doc'
        run: |
          python3 -m pip install -r scripts/requirements.txt
          # #648 compares real certified caches through the Parquet exporter.
          # Install its extension during setup; the Rust scenario disables
          # automatic extension downloads so the test itself stays offline.
          python3 -c "import duckdb; c = duckdb.connect(); c.execute('INSTALL sqlite_scanner'); c.close()"

      - name: Nextest partition
        if: matrix.suite != 'doc'
        env:
          SHARD: ${{ matrix.shard }}
        run: cargo nextest run --workspace --all-features --partition "hash:${SHARD}/4" -E 'not (binary_id(pe-service::scenario_golden_stream_v1) | binary_id(pe-service::scenario_deployed_flow))'

      - name: Doc tests
        if: matrix.suite == 'doc'
        run: cargo test --doc --workspace --all-features

  rust-slow:
    name: slow service scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Disk space
        run: df -h /

      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gate
          save-if: "false"

      # The complement of the `rust` job's nextest filter: together they run every test once.
      # `--workspace --all-features` keeps the gate's unified feature graph for these tests.
      - run: cargo nextest run --workspace --all-features -E 'binary_id(pe-service::scenario_golden_stream_v1) | binary_id(pe-service::scenario_deployed_flow)'

  drift:
    name: Python drift-guard tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python analytics deps
        run: python3 -m pip install -r scripts/requirements.txt

      # The financial-era suite executes this exact command, so it stays a literal step here.
      - name: Rehearsal dry run
        run: |
          bash scripts/deploy/rehearsal545.sh --dry-run \
            0000000000000000000000000000000000000000 >/dev/null

      - name: Python drift-guard tests
        run: python3 scripts/run_ci_suites.py drift

  activation-generation:
    name: generation activation scenarios
    needs: changes
    if: needs.changes.outputs.activation == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: bash scripts/deploy/test_activate_generation.sh
        env:
          SHARD: "${{ matrix.shard }}/4"
          PE_ACTIVATION_TEST_VERBOSE: "1"

  activation-financial:
    name: financial-era activation scenarios
    needs: changes
    if: needs.changes.outputs.activation == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: bash scripts/paper_reset/test_activate_financial_era.sh
        env:
          SHARD: "${{ matrix.shard }}/6"

  postgres:
    name: Postgres scenarios
    runs-on: ubuntu-latest
    # Postgres for the issue #397 authoritative-RPC parity + concurrency test
    # (crates/service/tests/pg_parity.rs). The main nextest gate self-skips that test
    # (PE_TEST_PG_URL unset); the dedicated steps below load the schema and run it for real.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Disk space
        run: df -h /

      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gate
          save-if: "false"

      # ── Authoritative-RPC parity + concurrency (issue #397) ──────────────────────────
      # Load both Supabase schema files into the Postgres service (creating the Supabase
      # roles the grants reference), then run the pg_parity test against the real PL/pgSQL.
      # This is the only check of the live SQL execution + the B-E self-referencing-UPDATE
      # lost-update safety; workspace nextest shards self-skip it (no PE_TEST_PG_URL).
      - name: Load Supabase schema into Postgres
        env:
          PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
          PGURL: postgres://postgres:postgres@localhost:5432/pe_ci_template
        run: |
          psql "$PG_ADMIN_URL" -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin nobypassrls;
          create role authenticated nologin nobypassrls;
          create role service_role nologin bypassrls;
          create database pe_ci_template;
          SQL
          psql "$PGURL" -v ON_ERROR_STOP=1 -f scripts/supabase_schema.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -f scripts/supabase_paper_state_schema.sql
          # Matview SQL must load on vanilla Postgres too (its pg_cron block self-skips when the
          # extension is absent, as it is here); validates the DDL + the wallet_live_stats_mv index/grant.
          psql "$PGURL" -v ON_ERROR_STOP=1 -f scripts/supabase_wallet_live_stats_mv.sql
          # Multi-account live schema (#508 Phase B): loaded TWICE to prove idempotent re-run.
          psql "$PGURL" -v ON_ERROR_STOP=1 -f scripts/supabase_multi_account_live_schema.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -f scripts/supabase_multi_account_live_schema.sql

      - name: Postgres suites in isolated databases
        env:
          PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
          PE_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/pe_ci_template
        run: python3 scripts/run_ci_suites.py postgres
