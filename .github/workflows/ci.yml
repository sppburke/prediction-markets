name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  gate:
    name: rustc 1.95.0 acceptance gate
    runs-on: ubuntu-latest
    # Postgres for the issue #397 authoritative-RPC parity + concurrency test
    # (crates/service/tests/pg_parity.rs). The main nextest gate self-skips that test
    # (PE_TEST_PG_URL unset); the dedicated step below loads the schema and runs it for real.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      # The Rust target/ plus the (#397) redundant `pe-service --features scenario` re-link can
      # exhaust the runner root fs; that surfaces as `ld ... signal 7 [Bus error]` while linking
      # (a full-fs mmap fault, not OOM). Adding the #421 Python deps (arch/statsmodels) tipped it
      # over, so reclaim the preinstalled SDKs this job never uses (~tens of GB). df -h is kept as
      # a diagnostic so disk headroom is visible in the log.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell || true
          df -h /

      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny,cargo-audit

      - uses: Swatinem/rust-cache@v2

      - name: rustc version contains 1.95.0
        run: rustc --version | grep -F '1.95.0'

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - run: cargo test --doc --workspace --all-features

      - run: cargo nextest run --workspace --all-features

      - run: cargo deny check

      - run: cargo audit

      - run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python analytics deps
        run: python3 -m pip install -r scripts/requirements.txt

      - name: Python drift-guard tests
        run: |
          python3 scripts/test_push_ranking_filter.py
          python3 scripts/test_ranker_decay.py
          python3 scripts/test_rank_72hr_consolidated.py
          python3 scripts/test_clob_reconciliation.py
          python3 scripts/test_rank_and_push.py
          python3 scripts/test_ranker_duck_parity.py
          python3 scripts/test_probe_gamma_ua.py
          python3 scripts/test_ranker_interfaces.py
          python3 scripts/test_ranker_suff_stats.py
          python3 scripts/test_ranker_estimators.py
          python3 scripts/test_ranker_deflation.py
          python3 scripts/test_ranker_oos_validation.py

      # ── Authoritative-RPC parity + concurrency (issue #397) ──────────────────────────
      # Load both Supabase schema files into the Postgres service (creating the Supabase
      # roles the grants reference), then run the pg_parity test against the real PL/pgSQL.
      # This is the only check of the live SQL execution + the B-E self-referencing-UPDATE
      # lost-update safety; the workspace nextest above self-skips it (no PE_TEST_PG_URL).
      - name: Load Supabase schema into Postgres
        env:
          PGURL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -c "create role anon nologin; create role authenticated nologin; create role service_role nologin;"
          psql "$PGURL" -v ON_ERROR_STOP=1 -f scripts/supabase_schema.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -f scripts/supabase_paper_state_schema.sql
          # Matview SQL must load on vanilla Postgres too (its pg_cron block self-skips when the
          # extension is absent, as it is here); validates the DDL + the wallet_live_stats_mv index/grant.
          psql "$PGURL" -v ON_ERROR_STOP=1 -f scripts/supabase_wallet_live_stats_mv.sql

      - name: Postgres RPC parity + concurrency test (issue #397)
        env:
          PE_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: cargo nextest run -p pe-service --features scenario pg_parity
