name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  gate:
    name: rustc 1.95.0 acceptance gate
    runs-on: ubuntu-latest
    # Postgres for the issue #397 authoritative-RPC parity + concurrency test
    # (crates/service/tests/pg_parity.rs). The main nextest gate self-skips that test
    # (PE_TEST_PG_URL unset); the dedicated step below loads the schema and runs it for real.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Agent workflow contracts
        run: |
          bash scripts/check_skill_parity.sh
          bash scripts/check_skill_parity.sh --sync
          git diff --exit-code
          python3 scripts/check_agent_workflow_contract.py

      # The Rust target/ plus the (#397) redundant `pe-service --features scenario` re-link can
      # exhaust the runner root fs; that surfaces as `ld ... signal 7 [Bus error]` while linking
      # (a full-fs mmap fault, not OOM). Adding the #421 Python deps (arch/statsmodels) tipped it
      # over, so reclaim the preinstalled SDKs this job never uses (~tens of GB). df -h is kept as
      # a diagnostic so disk headroom is visible in the log.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell || true
          df -h /

      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny,cargo-audit

      - uses: Swatinem/rust-cache@v2

      - name: rustc version contains 1.95.0
        run: rustc --version | grep -F '1.95.0'

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - run: cargo test --doc --workspace --all-features

      - name: Install Python analytics deps (needed by in-test cross-reader parity, #544)
        run: python3 -m pip install -r scripts/requirements.txt

      - run: cargo nextest run --workspace --all-features

      - run: cargo deny check

      - run: cargo audit

      - run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Python drift-guard tests
        run: |
          bash -n scripts/deploy/*.sh scripts/paper_reset/*.sh
          bash scripts/deploy/rehearsal545.sh --dry-run \
            0000000000000000000000000000000000000000 >/dev/null
          python3 scripts/check_sql_unfiltered_dml.py
          python3 scripts/test_push_ranking_filter.py
          python3 scripts/test_ranker_decay.py
          python3 scripts/test_rank_72hr_consolidated.py
          python3 scripts/test_clob_reconciliation.py
          python3 scripts/test_rank_and_push.py
          python3 scripts/test_rank_and_push_loop.py
          python3 scripts/test_ranker_duck_parity.py
          python3 scripts/test_latency_shift_ref_oracle.py
          python3 scripts/test_probe_gamma_ua.py
          python3 scripts/test_ranker_interfaces.py
          python3 scripts/test_ranker_suff_stats.py
          python3 scripts/test_ranker_estimators.py
          python3 scripts/test_ranker_deflation.py
          python3 scripts/test_ranker_oos_validation.py
          python3 scripts/test_ranker_selectors.py
          python3 scripts/test_ranker_demotion.py
          python3 scripts/test_ranker_policies.py
          python3 scripts/test_ranker_bakeoff.py
          python3 scripts/test_ranker_confirmatory.py
          python3 scripts/test_ranker_bench_composition.py
          python3 scripts/test_ranker_clv_source_comparison.py
          python3 scripts/verify_bakeoff_components.py
          bash scripts/deploy/test_activate_generation.sh
          bash scripts/paper_reset/test_activate_financial_era.sh

      - name: Legacy-to-financial PostgreSQL archive/restore scenario (issue #545)
        env:
          PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
          PG_LEGACY_URL: postgres://postgres:postgres@localhost:5432/pe_legacy_545
        run: |
          psql "$PG_ADMIN_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$ begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then create role anon nologin; end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then create role authenticated nologin; end if;
            if not exists (select 1 from pg_roles where rolname = 'service_role') then create role service_role nologin; end if;
          end $$;
          SQL
          psql "$PG_ADMIN_URL" -v ON_ERROR_STOP=1 -c 'create database pe_legacy_545;'
          legacy_schema="$RUNNER_TEMP/supabase_paper_state_schema.pre-545.sql"
          git show origin/main:scripts/supabase_paper_state_schema.sql > "$legacy_schema"
          psql "$PG_LEGACY_URL" -v ON_ERROR_STOP=1 -f scripts/supabase_schema.sql
          psql "$PG_LEGACY_URL" -v ON_ERROR_STOP=1 -f "$legacy_schema"
          psql "$PG_LEGACY_URL" -v ON_ERROR_STOP=1 <<'SQL'
          insert into service_config (key, value, value_type) values
            ('fill_mode', 'clob_best_ask', 'text'),
            ('polymarket_fee_rate', '0.04', 'decimal'),
            ('kelly_fraction_override', '0.01', 'decimal');
          do $$ begin
            if (select count(*) from service_config) <> 17 then
              raise exception 'legacy service_config row count is %, expected 17',
                (select count(*) from service_config);
            end if;
          end $$;
          insert into paper_bankroll (id, bankroll_str) values (0, '9998.625');
          insert into paper_positions
            (market_id, outcome_id, long_contracts, short_contracts)
            values ('legacy-market', 0, 1, 0);
          insert into paper_fills
            (idempotency_key, leader_wallet, source_trade_id, market_id, outcome_id,
             side, contracts, fill_price, entry_unix, event_seq)
            values ('legacy-fill', '0x1111111111111111111111111111111111111111',
                    'legacy-source', 'legacy-market', 0, 'buy', 1.25, 0.55, 100, 7);
          insert into settled_markets
            (market_id, outcome_prices, credit_applied, settled_at_unix)
            values ('settled-market', '[1,0]'::jsonb, 0.625, 101);
          insert into fill_market_snapshots
            (idempotency_key, captured_at_unix) values ('legacy-fill', 100);
          SQL
          psql "$PG_LEGACY_URL" -v ON_ERROR_STOP=1 -f scripts/supabase_paper_state_schema.sql
          psql "$PG_LEGACY_URL" -v ON_ERROR_STOP=1 -f scripts/migrate_service_config_545.sql
          psql "$PG_LEGACY_URL" -v ON_ERROR_STOP=1 <<'SQL'
          update paper_positions
             set long_contracts = 1.125, short_contracts = 0.375
           where market_id = 'legacy-market' and outcome_id = 0;
          do $$ begin
            if (select count(*) from service_config) <> 15 then
              raise exception 'financial service_config row count is %, expected 15',
                (select count(*) from service_config);
            end if;
            if exists (select 1 from service_config where key in ('fill_mode', 'polymarket_fee_rate')) then
              raise exception 'retired financial configuration survived migration';
            end if;
          end $$;
          SQL
          psql "$PG_LEGACY_URL" -v ON_ERROR_STOP=1 -v activation_id=ci-545-fractional \
            -v bankroll=10000 -f scripts/paper_reset/archive_paper_state.sql
          psql "$PG_LEGACY_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$ begin
            if (select count(*) from paper_fills) <> 0
               or (select count(*) from paper_positions) <> 0
               or (select count(*) from settled_markets) <> 0 then
              raise exception 'archive did not clear the live legacy book';
            end if;
            if not exists (
              select 1 from paper_fills_archive
               where activation_id = 'ci-545-fractional' and contracts = 1.25
            ) or not exists (
              select 1 from paper_positions_archive
               where activation_id = 'ci-545-fractional'
                 and long_contracts = 1.125 and short_contracts = 0.375
            ) then
              raise exception 'fractional values were not archived exactly';
            end if;
          end $$;
          SQL
          psql "$PG_LEGACY_URL" -v ON_ERROR_STOP=1 -v activation_id=ci-545-fractional \
            -f scripts/paper_reset/restore_paper_state.sql
          psql "$PG_LEGACY_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$ begin
            if not exists (select 1 from paper_fills where contracts = 1.25)
               or not exists (
                 select 1 from paper_positions
                  where long_contracts = 1.125 and short_contracts = 0.375
               )
               or not exists (select 1 from paper_bankroll where bankroll_str::numeric = 9998.625)
               or not exists (select 1 from settled_markets where credit_applied = 0.625) then
              raise exception 'fractional archive/restore round trip changed the legacy book';
            end if;
          end $$;
          SQL

      # ── Authoritative-RPC parity + concurrency (issue #397) ──────────────────────────
      # Load both Supabase schema files into the Postgres service (creating the Supabase
      # roles the grants reference), then run the pg_parity test against the real PL/pgSQL.
      # This is the only check of the live SQL execution + the B-E self-referencing-UPDATE
      # lost-update safety; the workspace nextest above self-skips it (no PE_TEST_PG_URL).
      - name: Load Supabase schema into Postgres
        env:
          PGURL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -f scripts/supabase_schema.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -f scripts/supabase_paper_state_schema.sql
          # Matview SQL must load on vanilla Postgres too (its pg_cron block self-skips when the
          # extension is absent, as it is here); validates the DDL + the wallet_live_stats_mv index/grant.
          psql "$PGURL" -v ON_ERROR_STOP=1 -f scripts/supabase_wallet_live_stats_mv.sql
          # Multi-account live schema (#508 Phase B): loaded TWICE to prove idempotent re-run.
          psql "$PGURL" -v ON_ERROR_STOP=1 -f scripts/supabase_multi_account_live_schema.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -f scripts/supabase_multi_account_live_schema.sql

      - name: Multi-account schema acceptance suite (issue #508)
        env:
          PG_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: bash scripts/test_multi_account_schema.sh "$PG_URL"

      - name: Postgres RPC parity + concurrency test (issue #397)
        env:
          PE_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: cargo nextest run -p pe-service --features scenario --test pg_parity

      - name: Ranking publication RPC idempotency + rollback test
        env:
          PE_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: python3 scripts/test_ranking_publish_rpc.py
