# nginx reverse proxy for pe-analytics-site (#398 WS3, step 21).
# Install: copy to /etc/nginx/sites-available/pe-site, symlink into sites-enabled, set
# <your-domain>, `sudo nginx -t && sudo systemctl reload nginx`, then provision TLS with:
#   sudo certbot --nginx -d <your-domain>
# Certbot rewrites this to add the listen 443 ssl block + an HTTP→HTTPS redirect.
server {
    listen 80;
    server_name <your-domain>;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
