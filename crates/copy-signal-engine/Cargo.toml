[package]
name = "pe-copy-signal-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "pe_copy_signal_engine"
path = "src/lib.rs"

[features]
scenario = []

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
float_arithmetic = "deny"

[dependencies]
pe-core-types = { path = "../core-types", version = "0.1.0" }
pe-trader-index = { path = "../trader-index", version = "0.1.0" }
rust_decimal = { workspace = true }
serde = { workspace = true }
time = { workspace = true }

[dev-dependencies]
blake3 = { workspace = true }
proptest = { workspace = true }
rust_decimal_macros = { workspace = true }
