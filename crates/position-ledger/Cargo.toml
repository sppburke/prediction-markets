[package]
name = "pe-position-ledger"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "pe_position_ledger"
path = "src/lib.rs"

[features]
scenario = []

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
float_arithmetic = "deny"

[dependencies]
pe-core-types        = { path = "../core-types",        version = "0.1.0" }
pe-copy-signal-engine = { path = "../copy-signal-engine", version = "0.1.0" }

[dev-dependencies]
blake3              = { workspace = true }
rust_decimal        = { workspace = true }
rust_decimal_macros = { workspace = true }
serde_json          = { workspace = true }
time                = { workspace = true }
