[package]
name = "pe-service"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "pe-service"
path = "src/main.rs"

[[bin]]
name = "pe-service-live-canary"
path = "src/bin/pe-service-live-canary.rs"

[lib]
name = "pe_service"
path = "src/lib.rs"

[features]
# Deterministic scenario seams (in-process activity websocket peers, orchestrator age clock and
# one-shot faults); enables the source crate's matching seam so both exist only in scenario builds.
scenario = ["pe-source-polymarket-public/scenario", "pe-event-log/scenario"]

[lints]
workspace = true

[dependencies]
age = { version = "0.11", features = ["armor"] }
pe-core-types               = { path = "../core-types",                 version = "0.1.0" }
pe-copy-signal-engine       = { path = "../copy-signal-engine",         version = "0.1.0" }
pe-event-log                = { path = "../event-log",                  version = "0.1.0" }
pe-kelly-sizer              = { path = "../kelly-sizer",                version = "0.1.0" }
pe-risk-engine              = { path = "../risk-engine",                version = "0.1.0" }
pe-resolver-card            = { path = "../resolver-card",              version = "0.1.0" }
pe-source-core              = { path = "../source-core",                version = "0.1.0" }
pe-source-polymarket-public = { path = "../source-polymarket-public",   version = "0.1.0" }
pe-strategy-winner-follow   = { path = "../strategy-winner-follow",     version = "0.1.0" }
pe-trader-index             = { path = "../trader-index",               version = "0.1.0" }
pe-position-ledger          = { path = "../position-ledger",            version = "0.1.0" }
pe-venue-core               = { path = "../venue-core",                 version = "0.1.0" }
pe-venue-polymarket         = { path = "../venue-polymarket",           version = "0.1.0" }
pe-execution-core           = { path = "../execution-core",             version = "0.1.0" }
pe-paper-state              = { path = "../paper-state",                version = "0.1.0" }
pe-paper-pnl                = { path = "../paper-pnl",                  version = "0.1.0" }

anyhow          = { workspace = true }
blake3          = { workspace = true }
arc-swap        = { workspace = true }
axum            = { workspace = true }
figment         = { workspace = true }
futures         = { workspace = true }
toml            = { workspace = true }
reqwest         = { workspace = true }
rust_decimal    = { workspace = true }
rustix          = { version = "1.1.4", features = ["process"] }
serde           = { workspace = true }
serde_json      = { workspace = true }
thiserror       = { workspace = true }
time            = { workspace = true }
tokio           = { workspace = true }
tracing         = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
base64.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
# Paused-clock scenario tests drive the reader timers with the production constants (#546).
tokio = { workspace = true, features = ["test-util"] }
rust_decimal_macros = { workspace = true }
tempfile = { workspace = true }
# Live-Postgres parity + AC9 concurrency harness (issue #397 follow-up), `scenario` feature;
# the test self-skips when PE_TEST_PG_URL is unset (CI sets it to the postgres service).
tokio-postgres = { workspace = true }
