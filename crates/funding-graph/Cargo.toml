[package]
name = "pe-funding-graph"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "pe_funding_graph"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
float_arithmetic = "deny"

[features]
scenario = []

[dependencies]
pe-core-types = { path = "../core-types", version = "0.1.0" }
pe-operator-graph = { path = "../operator-graph", version = "0.1.0" }
pe-source-onchain-polygon = { path = "../source-onchain-polygon", version = "0.1.0" }
rust_decimal = { workspace = true }
time = { workspace = true }

[dev-dependencies]
rust_decimal_macros = { workspace = true }
