[package]
name = "pe-kelly-sizer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "pe_kelly_sizer"
path = "src/lib.rs"

[features]
scenario = []

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
float_arithmetic = "deny"

[dependencies]
pe-core-types = { path = "../core-types", version = "0.1.0" }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
