[package]
name = "pe-skill-select"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "pe_skill_select"
path = "src/lib.rs"

# Mirrors trader-index: the workspace level is only `warn` for float_arithmetic,
# so this crate opts into `deny` to make the no-f64 money discipline a hard
# compile error (issue #212).
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
float_arithmetic = "deny"

[features]
# Forward to pe-bootstrap's scenario feature so the cache's test-only seeding
# helpers (e.g. `conn_for_test_set_active`) are available to our scenario tests.
scenario = ["pe-bootstrap/scenario"]

[dependencies]
pe-bootstrap = { path = "../bootstrap", version = "0.1.0" }
pe-core-types = { path = "../core-types", version = "0.1.0" }
pe-trader-index = { path = "../trader-index", version = "0.1.0" }
rusqlite = { version = "0.32", features = ["bundled"] }
rust_decimal = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
rust_decimal_macros = { workspace = true }
tempfile = { workspace = true }
