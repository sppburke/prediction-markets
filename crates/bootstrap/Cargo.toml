[package]
name = "pe-bootstrap"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "pe-bootstrap"
path = "src/main.rs"

[[bin]]
name = "pe-operator-audit"
path = "src/bin/operator-audit.rs"

[lib]
name = "pe_bootstrap"
path = "src/lib.rs"

[features]
# Issue #186: pe-source-onchain-polygon hosts the cross-crate
# `InMemoryChainLogFetcher` test stub; forwarding `scenario` keeps the inline
# tests in `polygon_ctf_delta::tests` compiling whenever bootstrap's own
# scenario feature is on (and under `--workspace --all-features`).
scenario = ["pe-source-onchain-polygon/scenario"]

[lints]
workspace = true

[dependencies]
pe-core-types                 = { path = "../core-types",                   version = "0.1.0" }
pe-operator-graph             = { path = "../operator-graph",               version = "0.1.0" }
pe-source-core                = { path = "../source-core",                  version = "0.1.0" }
pe-source-onchain-polygon     = { path = "../source-onchain-polygon",       version = "0.1.0" }
pe-source-polymarket-public   = { path = "../source-polymarket-public",     version = "0.1.0" }
pe-trader-index               = { path = "../trader-index",                 version = "0.1.0" }

alloy           = { workspace = true }
anyhow          = { workspace = true }
figment         = { workspace = true }
futures         = { workspace = true }
reqwest         = { workspace = true }
rusqlite        = { version = "0.32", features = ["bundled"] }
rust_decimal    = { workspace = true }
serde           = { workspace = true }
serde_json      = { workspace = true }
thiserror       = { workspace = true }
time            = { workspace = true }
tokio           = { workspace = true }
toml            = { workspace = true }
tracing         = { workspace = true }
tracing-subscriber = { workspace = true }
url             = { workspace = true }

[dev-dependencies]
blake3              = { workspace = true }
rust_decimal_macros = { workspace = true }
tempfile            = { workspace = true }
