[package]
name = "pe-bootstrap"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "pe-bootstrap"
path = "src/main.rs"

[lib]
name = "pe_bootstrap"
path = "src/lib.rs"

[features]
# Gates bootstrap's `tests/scenario_*.rs` integration tests so a plain
# `cargo test` (without `--all-features`) skips them.
scenario = []

[lints]
workspace = true

[dependencies]
pe-core-types                 = { path = "../core-types",                   version = "0.1.0" }
pe-source-core                = { path = "../source-core",                  version = "0.1.0" }
pe-source-polymarket-public   = { path = "../source-polymarket-public",     version = "0.1.0" }
pe-trader-index               = { path = "../trader-index",                 version = "0.1.0" }

alloy-primitives = { workspace = true }
anyhow          = { workspace = true }
const_format    = { workspace = true }
figment         = { workspace = true }
futures         = { workspace = true }
reqwest         = { workspace = true }
rusqlite        = { version = "0.32", features = ["bundled"] }
rust_decimal    = { workspace = true }
serde           = { workspace = true }
serde_json      = { workspace = true }
sha2            = { workspace = true }
thiserror       = { workspace = true }
time            = { workspace = true }
tokio           = { workspace = true }
toml            = { workspace = true }
tracing         = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# Archive-artifact assertions open the purge-archive SQLite directly (scenario_purge).
rusqlite            = { version = "0.32", features = ["bundled"] }
rust_decimal_macros = { workspace = true }
tempfile            = { workspace = true }
# `test-util` enables tokio's paused virtual clock (`start_paused`) so the CLOB
# retry scenarios assert backoff behaviour without real wall-clock delay.
tokio               = { workspace = true, features = ["test-util"] }
