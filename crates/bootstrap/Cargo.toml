[package]
name = "pe-bootstrap"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "pe-bootstrap"
path = "src/main.rs"

[lib]
name = "pe_bootstrap"
path = "src/lib.rs"

[features]
# Gates bootstrap's `tests/scenario_*.rs` integration tests so a plain
# `cargo test` (without `--all-features`) skips them.
scenario = []

[lints]
workspace = true

[dependencies]
pe-core-types                 = { path = "../core-types",                   version = "0.1.0" }
pe-position-ledger            = { path = "../position-ledger",              version = "0.1.0" }
pe-source-core                = { path = "../source-core",                  version = "0.1.0" }
pe-source-polymarket-public   = { path = "../source-polymarket-public",     version = "0.1.0" }
pe-trader-index               = { path = "../trader-index",                 version = "0.1.0" }
pe-venue-polymarket           = { path = "../venue-polymarket",             version = "0.1.0" }

alloy-primitives = { workspace = true }
anyhow          = { workspace = true }
const_format    = { workspace = true }
figment         = { workspace = true }
futures         = { workspace = true }
fs2             = { workspace = true }
reqwest         = { workspace = true }
rusqlite        = { version = "0.32", features = ["bundled"] }
rust_decimal    = { workspace = true }
serde           = { workspace = true }
serde_json      = { workspace = true }
sha2            = { workspace = true }
thiserror       = { workspace = true }
time            = { workspace = true }
tokio           = { workspace = true }
toml            = { workspace = true }
tracing         = { workspace = true }
tracing-subscriber = { workspace = true }

# sha2 0.10 compiles its ARMv8 SHA-256 instruction backend only with `asm`; without
# it the Raspberry Pi hashes whole cache files in software. Measured on Forge over the
# same 8 GB: 166 MB/s software, 470 MB/s with the instructions, identical digests
# (#588). The backend still falls back to software on CPUs without the extension.
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

[dev-dependencies]
# Archive-artifact assertions open the purge-archive SQLite directly (scenario_purge).
# `trace` (test builds only, via feature unification): the #538 reclamation tests
# install a SQL trace to prove which maintenance statement ran.
rusqlite            = { version = "0.32", features = ["bundled", "trace", "hooks"] }
rust_decimal_macros = { workspace = true }
tempfile            = { workspace = true }
# `test-util` enables tokio's paused virtual clock (`start_paused`) so the CLOB
# retry scenarios assert backoff behaviour without real wall-clock delay.
tokio               = { workspace = true, features = ["test-util"] }
