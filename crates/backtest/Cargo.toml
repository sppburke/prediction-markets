[package]
name = "pe-backtest"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "pe-backtest"
path = "src/main.rs"

[lib]
name = "pe_backtest"
path = "src/lib.rs"

[features]
scenario = []

# Lints are specified manually (not via workspace = true) so we can downgrade
# unsafe_code from workspace `forbid` to `deny`, allowing scenario tests to use
# #[allow(unsafe_code)] for env-var manipulation. nextest process-per-test makes it safe.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used    = "deny"
expect_used    = "deny"
panic          = "deny"
float_arithmetic = "warn"

[dependencies]
pe-bootstrap                  = { path = "../bootstrap",               version = "0.1.0" }
pe-copy-signal-engine         = { path = "../copy-signal-engine",      version = "0.1.0" }
pe-core-types                 = { path = "../core-types",              version = "0.1.0" }
pe-kelly-sizer                = { path = "../kelly-sizer",             version = "0.1.0" }
pe-risk-engine                = { path = "../risk-engine",             version = "0.1.0" }
pe-source-core                = { path = "../source-core",             version = "0.1.0" }
pe-strategy-winner-follow     = { path = "../strategy-winner-follow",  version = "0.1.0" }
pe-trader-index               = { path = "../trader-index",            version = "0.1.0" }

figment         = { workspace = true }
rayon           = { workspace = true }
reqwest         = { workspace = true }
rust_decimal    = { workspace = true }
serde           = { workspace = true }
serde_json      = { workspace = true }
thiserror       = { workspace = true }
time            = { workspace = true }
tokio           = { workspace = true }
toml            = { workspace = true }
tracing         = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
blake3              = { workspace = true }
rust_decimal_macros = { workspace = true }
tempfile            = { workspace = true }
